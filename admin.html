<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — ppolinom handmade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf7fc;
      --surface: #fff;
      --border: #e8d8f0;
      --text: #2a1f33;
      --muted: #9b86aa;
      --accent: #9b59b6;
      --accent-hover: #7d3f9a;
      --accent-soft: #f3e8f9;
      --danger: #e74c3c;
      --danger-soft: #fdf0ee;
      --success: #27ae60;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #f9eeff 0%, #fce4f5 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header a { color: var(--muted); font-size: 0.875rem; text-decoration: none; }
    header a:hover { color: var(--text); }

    .container { max-width: 960px; margin: 0 auto; padding: 2rem; }

    /* Token screen */
    #token-screen {
      max-width: 480px; margin: 4rem auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
    }
    #token-screen h2 { margin-bottom: 0.5rem; }
    #token-screen p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5; }

    /* Forms & inputs */
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    input[type=text], input[type=number], input[type=password], textarea, select {
      width: 100%; padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit; color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 100px; }
    .field { margin-bottom: 1.25rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.25rem; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: var(--accent-soft); color: var(--accent); }
    .btn-secondary:hover:not(:disabled) { background: #e8d4f5; }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-danger:hover:not(:disabled) { background: #fce0dd; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .toolbar h2 { font-size: 1.2rem; }

    /* Product list */
    .product-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .product-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .product-row img {
      width: 56px; height: 56px; border-radius: 8px;
      object-fit: cover; background: var(--bg); flex-shrink: 0;
    }
    .product-row-placeholder {
      width: 56px; height: 56px; border-radius: 8px;
      background: var(--accent-soft); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .product-row-info { flex: 1; min-width: 0; }
    .product-row-info .name { font-weight: 600; font-size: 0.95rem; }
    .product-row-info .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .product-row-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .badge { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px; }
    .badge-on { background: #e6f9ed; color: var(--success); }
    .badge-off { background: var(--accent-soft); color: var(--muted); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(42,31,51,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 2rem 1rem; overflow-y: auto; z-index: 100;
    }
    .modal {
      background: var(--surface); border-radius: 16px;
      width: 100%; max-width: 560px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      padding: 1.75rem;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .modal-header h2 { font-size: 1.15rem; }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); line-height: 1; padding: 0.1rem 0.3rem; border-radius: 4px; }
    .modal-close:hover { color: var(--text); background: var(--bg); }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }

    /* Images upload area */
    .images-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .img-thumb {
      position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border); cursor: grab;
    }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-thumb-remove {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50%;
      width: 18px; height: 18px; font-size: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .img-add {
      width: 72px; height: 72px; border-radius: 8px;
      border: 1.5px dashed var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--muted); cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .img-add:hover { border-color: var(--accent); color: var(--accent); }

    /* Toast */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--text); color: #fff;
      padding: 0.65rem 1.25rem; border-radius: 10px;
      font-size: 0.875rem; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.error { background: var(--danger); }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* Tag input */
    .tag-input-wrap {
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 0.35rem 0.5rem; min-height: 42px;
      display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
      background: var(--surface); cursor: text;
      transition: border-color 0.15s;
    }
    .tag-input-wrap:focus-within { border-color: var(--accent); }
    .tag {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 999px; padding: 0.2rem 0.5rem 0.2rem 0.7rem;
      font-size: 0.8rem; font-weight: 500; white-space: nowrap;
    }
    .tag button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; line-height: 1; font-size: 1rem; opacity: 0.6; }
    .tag button:hover { opacity: 1; }
    .tag-input-row { position: relative; flex: 1; min-width: 140px; }
    .tag-input-row input {
      border: none; outline: none; padding: 0.25rem 0.4rem;
      font-size: 0.9rem; width: 100%; background: transparent; font-family: inherit; color: var(--text);
    }
    .autocomplete-dropdown {
      position: absolute; top: calc(100% + 4px); left: -6px; right: -6px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 50; overflow: hidden;
    }
    .autocomplete-item {
      padding: 0.5rem 0.85rem; font-size: 0.875rem; cursor: pointer;
    }
    .autocomplete-item:hover, .autocomplete-item.focused { background: var(--accent-soft); }
    .autocomplete-item.new-cat { color: var(--muted); }
    .autocomplete-item.new-cat strong { color: var(--text); font-style: normal; }

    /* Admin filters */
    .admin-filters { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
    .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.4rem 1rem; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 0.875rem;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Hidden product dimming */
    .product-row.is-hidden { opacity: 0.45; }
    .product-row.is-hidden:hover { opacity: 0.7; }
    .badge-hidden { background: #f0ebe5; color: var(--muted); }

    /* Image drag-and-drop ordering */
    .img-thumb.dragging { opacity: 0.4; cursor: grabbing; }
    .img-thumb.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }

    /* Taxonomy modal */
    .taxonomy-block {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .taxonomy-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .taxonomy-block-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem; }

    .tx-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.3rem 0;
    }
    .tx-item-name { flex: 1; font-size: 0.9rem; }

    .tx-collection-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0;
      flex-wrap: wrap;
    }
    .tx-toggle { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--muted); white-space: nowrap; cursor: pointer; flex-shrink: 0; }
    .tx-toggle input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
    .tx-collection-item input[type=text] { padding: 0.4rem 0.6rem; font-size: 0.85rem; }
    .tx-collection-name { flex: 1; min-width: 120px; }
    .tx-add-row { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    .tx-add-row input { flex: 1; }

    .tx-col-img {
      width: 72px; height: 46px; border-radius: 6px;
      border: 1.5px dashed var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; overflow: hidden; position: relative;
      transition: border-color 0.15s;
    }
    .tx-col-img:hover { border-color: var(--accent); }
    .tx-col-img img { width: 100%; height: 100%; object-fit: cover; }
    .tx-col-img-placeholder { font-size: 0.7rem; color: var(--muted); text-align: center; line-height: 1.3; padding: 0 4px; }
    .tx-col-img-remove {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,0.55); color: #fff; border: none;
      border-radius: 50%; width: 15px; height: 15px; font-size: 9px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Taxonomy drag-and-drop */
    .tx-drag-handle { cursor: grab; color: var(--border); font-size: 0.85rem; padding: 0 2px; flex-shrink: 0; user-select: none; }
    .tx-drag-handle:hover { color: var(--muted); }
    .tx-item.tx-dragging, .tx-collection-item.tx-dragging { opacity: 0.4; }
    .tx-item.tx-drag-over, .tx-collection-item.tx-drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 6px; }
  </style>
</head>
<body>

<header>
  <h1>Админка</h1>
  <div style="display:flex;gap:1rem;align-items:center">
    <a href="./" target="_blank">← Сайт</a>
    <button class="btn btn-sm btn-secondary" id="btn-logout">Выйти</button>
  </div>
</header>

<!-- Token screen -->
<div id="token-screen" class="hidden">
  <h2>Введите GitHub токен</h2>
  <p>Токен сохранится в браузере и не будет никуда передан.<br>
     Нужны права: <strong>repo</strong> + <strong>workflow</strong>.</p>
  <div class="field">
    <label>Personal Access Token</label>
    <input type="password" id="token-input" placeholder="ghp_...">
  </div>
  <button class="btn btn-primary" id="btn-token-save">Войти</button>
</div>

<!-- Main admin -->
<div id="admin-screen" class="hidden">
  <div class="container">
    <div class="toolbar">
      <h2>Товары</h2>
      <div style="display:flex;gap:0.75rem">
        <button class="btn btn-secondary" id="btn-taxonomy">Справочник</button>
        <button class="btn btn-primary" id="btn-add">+ Добавить товар</button>
      </div>
    </div>
    <div class="admin-filters">
      <div class="filter-row" id="filter-visible-row">
        <button class="filter-btn active" data-vis="">Все</button>
        <button class="filter-btn" data-vis="true">Отображаемые</button>
        <button class="filter-btn" data-vis="false">Скрытые</button>
      </div>
      <div class="filter-row" id="filter-category-row">
        <button class="filter-btn active" data-cat="">Все теги</button>
      </div>
    </div>
    <div class="product-list" id="product-list">
      <p style="color:var(--muted)">Загрузка...</p>
    </div>
  </div>
</div>

<!-- Product modal -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Товар</h2>
      <button class="modal-close" id="modal-close">×</button>
    </div>

    <div class="field">
      <label>Название</label>
      <input type="text" id="f-name" placeholder="Браслет «Весна»">
    </div>
    <div class="field">
      <label>ID папки (латиница, заполняется автоматически)</label>
      <input type="text" id="f-id" placeholder="braslet-vesna">
    </div>
    <div class="field">
      <label>Разделы</label>
      <div class="tag-input-wrap" id="sections-wrap">
        <div class="tag-input-row" id="sections-input-row">
          <input type="text" id="f-sections-input" placeholder="Добавить раздел...">
          <div class="autocomplete-dropdown hidden" id="sections-dropdown"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Подборки</label>
      <div class="tag-input-wrap" id="collections-wrap">
        <div class="tag-input-row" id="collections-input-row">
          <input type="text" id="f-collections-input" placeholder="Добавить подборку...">
          <div class="autocomplete-dropdown hidden" id="collections-dropdown"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Категории</label>
      <div class="tag-input-wrap" id="categories-wrap">
        <div class="tag-input-row" id="cat-input-row">
          <input type="text" id="f-category-input" placeholder="Добавить категорию...">
          <div class="autocomplete-dropdown hidden" id="cat-dropdown"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Описание</label>
      <textarea id="f-description" placeholder="Опишите изделие..."></textarea>
    </div>
    <div class="field">
      <label>Цена (₽)</label>
      <input type="number" id="f-price" placeholder="500" min="0">
    </div>
    <div class="field">
      <label>Наличие</label>
      <select id="f-availability">
        <option value="on_order">На заказ</option>
        <option value="available">В наличии</option>
        <option value="unavailable">Нет в наличии</option>
      </select>
    </div>
    <div class="field">
      <label>Видимость на сайте</label>
      <select id="f-visible">
        <option value="true">Отображать</option>
        <option value="false">Скрыть с сайта</option>
      </select>
    </div>
    <div class="field">
      <label>Фотографии</label>
      <div class="images-grid" id="images-grid"></div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none">
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-delete" style="margin-right:auto">Удалить</button>
      <button class="btn btn-secondary" id="btn-cancel">Отмена</button>
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
    </div>
  </div>
</div>

<!-- Taxonomy modal -->
<div class="modal-overlay hidden" id="taxonomy-modal-overlay">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h2>Справочник</h2>
      <button class="modal-close" id="taxonomy-modal-close">×</button>
    </div>

    <div class="taxonomy-block">
      <div class="taxonomy-block-title">Разделы</div>
      <div id="tx-sections-list"></div>
      <div class="tx-add-row">
        <input type="text" id="tx-sections-input" placeholder="Новый раздел...">
        <button class="btn btn-secondary btn-sm" id="tx-sections-add">Добавить</button>
      </div>
    </div>

    <div class="taxonomy-block">
      <div class="taxonomy-block-title">Категории</div>
      <div id="tx-categories-list"></div>
      <div class="tx-add-row">
        <input type="text" id="tx-categories-input" placeholder="Новая категория...">
        <button class="btn btn-secondary btn-sm" id="tx-categories-add">Добавить</button>
      </div>
    </div>

    <div class="taxonomy-block">
      <div class="taxonomy-block-title">Подборки</div>
      <div id="tx-collections-list"></div>
      <div class="tx-add-row">
        <input type="text" id="tx-collections-input" placeholder="Название новой подборки...">
        <button class="btn btn-secondary btn-sm" id="tx-collections-add">Добавить</button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" id="taxonomy-cancel">Отмена</button>
      <button class="btn btn-primary" id="taxonomy-save">Сохранить</button>
    </div>
  </div>
</div>

<input type="file" id="collection-image-input" accept="image/*" style="display:none">
<div id="toast"></div>

<script>
const REPO = 'ppolinom/handmade';
const BRANCH = 'main';

// ── GitHub API ────────────────────────────────────────────────────────────────

function getToken() { return localStorage.getItem('gh_token'); }

async function ghFetch(path, options = {}) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

async function getFile(path) {
  try { return await ghFetch(`contents/${path}?ref=${BRANCH}`); }
  catch { return null; }
}

async function putFile(path, content, message, sha = undefined) {
  const body = { message, content: btoa(unescape(encodeURIComponent(content))), branch: BRANCH };
  if (sha) body.sha = sha;
  return ghFetch(`contents/${path}`, { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
}

async function putFileBinary(path, base64content, message, sha = undefined) {
  const body = { message, content: base64content, branch: BRANCH };
  if (sha) body.sha = sha;
  return ghFetch(`contents/${path}`, { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
}

async function deleteFile(path, message, sha) {
  return ghFetch(`contents/${path}`, { method: 'DELETE', body: JSON.stringify({ message, sha, branch: BRANCH }), headers: { 'Content-Type': 'application/json' } });
}

async function listDir(path) {
  try { return await ghFetch(`contents/${path}?ref=${BRANCH}`); }
  catch { return []; }
}

// ── Auth ──────────────────────────────────────────────────────────────────────

async function checkToken(token) {
  const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `Bearer ${token}` } });
  return res.ok;
}

function showTokenScreen() {
  document.getElementById('token-screen').classList.remove('hidden');
  document.getElementById('admin-screen').classList.add('hidden');
}

function showAdminScreen() {
  document.getElementById('token-screen').classList.add('hidden');
  document.getElementById('admin-screen').classList.remove('hidden');
}

document.getElementById('btn-token-save').addEventListener('click', async () => {
  const token = document.getElementById('token-input').value.trim();
  if (!token) return;
  const btn = document.getElementById('btn-token-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const ok = await checkToken(token).catch(() => false);
  btn.disabled = false; btn.textContent = 'Войти';
  if (!ok) { toast('Токен не подошёл', true); return; }
  localStorage.setItem('gh_token', token);
  showAdminScreen();
  await loadTaxonomyAdmin();
  loadProducts();
});

document.getElementById('btn-logout').addEventListener('click', () => {
  localStorage.removeItem('gh_token');
  showTokenScreen();
});

// ── Taxonomy (admin) ──────────────────────────────────────────────────────────

let taxonomy = { sections: [], categories: [], collections: [] };
let taxonomySha = null;

async function loadTaxonomyAdmin() {
  const f = await getFile('data/taxonomy.json');
  if (!f) return;
  try {
    const binary = atob(f.content.replace(/\n/g, ''));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    taxonomy = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    taxonomySha = f.sha;
  } catch {}
}

// ── Products list ─────────────────────────────────────────────────────────────

let products = []; // { id, data, images: [{name, sha}] }

async function loadProducts() {
  const listEl = document.getElementById('product-list');
  listEl.innerHTML = '<p style="color:var(--muted)">Загрузка...</p>';

  try {
    const dirs = (await listDir('products')).filter(f => f.type === 'dir');
    products = [];
    for (const dir of dirs) {
      const jsonFile = await getFile(`products/${dir.name}/product.json`);
      if (!jsonFile) continue;
      const binary = atob(jsonFile.content.replace(/\n/g, ''));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const data = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      const imgFiles = (await listDir(`products/${dir.name}/images`)).filter(f => /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name));
      products.push({ id: dir.name, jsonSha: jsonFile.sha, data, images: imgFiles });
    }
    renderProductList();
  } catch(e) {
    listEl.innerHTML = `<p style="color:var(--muted)">Ошибка загрузки: ${e.message}</p>`;
  }
}

function renderProductList() {
  const listEl = document.getElementById('product-list');

  // Rebuild tag filter buttons from sections + categories
  const catRow = document.getElementById('filter-category-row');
  const allTags = [...new Map(products.flatMap(p => [
    ...(Array.isArray(p.data.sections) ? p.data.sections : []),
    ...(Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : [])
  ].filter(c => typeof c === 'string').map(c => [c.toLowerCase(), c])).values())];
  catRow.innerHTML = `<button class="filter-btn${activeCatFilter === '' ? ' active' : ''}" data-cat="">Все теги</button>` +
    allTags.map(c => `<button class="filter-btn${activeCatFilter.toLowerCase() === c.toLowerCase() ? ' active' : ''}" data-cat="${c}">${c}</button>`).join('');

  const filtered = products.filter(p => {
    if (activeVisFilter === 'true' && p.data.visible === false) return false;
    if (activeVisFilter === 'false' && p.data.visible !== false) return false;
    if (activeCatFilter) {
      const tags = [
        ...(Array.isArray(p.data.sections) ? p.data.sections : []),
        ...(Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : [])
      ].filter(c => typeof c === 'string');
      if (!tags.some(c => c.toLowerCase() === activeCatFilter.toLowerCase())) return false;
    }
    return true;
  });

  if (!products.length) {
    listEl.innerHTML = '<p style="color:var(--muted)">Товаров пока нет. Добавьте первый!</p>';
    return;
  }
  if (!filtered.length) {
    listEl.innerHTML = '<p style="color:var(--muted)">Нет товаров по выбранным фильтрам.</p>';
    return;
  }

  listEl.innerHTML = filtered.map(p => {
    const i = products.indexOf(p);
    const isHidden = p.data.visible === false;
    const thumb = p.images[0]
      ? `<img src="https://raw.githubusercontent.com/${REPO}/${BRANCH}/products/${p.id}/images/${p.images[0].name}" alt="">`
      : `<div class="product-row-placeholder">🧶</div>`;
    const avail = p.data.availability || (p.data.available === false ? 'unavailable' : 'available');
    const availBadge = avail === 'available'
      ? '<span class="badge badge-on">В наличии</span>'
      : avail === 'on_order' ? '<span class="badge badge-off">На заказ</span>'
      : '<span class="badge badge-off">Нет</span>';
    const hiddenBadge = isHidden ? '<span class="badge badge-hidden">Скрыт</span>' : '';
    const allProductTags = [
      ...(Array.isArray(p.data.sections) ? p.data.sections : []),
      ...(Array.isArray(p.data.collections) ? p.data.collections : []),
      ...(Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : [])
    ];
    const tagBadges = allProductTags.length
      ? allProductTags.map(c => `<span class="tag" style="font-size:0.7rem;padding:0.1rem 0.5rem">${c}</span>`).join('')
      : '<span style="color:var(--muted)">—</span>';
    return `
      <div class="product-row${isHidden ? ' is-hidden' : ''}">
        ${thumb}
        <div class="product-row-info">
          <div class="name">${p.data.name || p.id} ${hiddenBadge}</div>
          <div class="meta" style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap">${tagBadges} · ${p.data.price || 0} ₽ · ${availBadge}</div>
        </div>
        <div class="product-row-actions">
          <button class="btn btn-sm btn-secondary" onclick="openEdit(${i})">Изменить</button>
        </div>
      </div>`;
  }).join('');
}

// ── Tag input factory ─────────────────────────────────────────────────────────

function createTagInput(opts) {
  // opts: { wrapId, inputId, dropdownId, getOptions }
  const wrap = document.getElementById(opts.wrapId);
  const input = document.getElementById(opts.inputId);
  const dropdown = document.getElementById(opts.dropdownId);

  let current = [];
  let dropdownValues = [];
  let focusIdx = -1;

  function render() {
    wrap.querySelectorAll('.tag').forEach(t => t.remove());
    const row = wrap.querySelector('.tag-input-row');
    current.forEach((val, i) => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = `${val} <button type="button">×</button>`;
      tag.querySelector('button').addEventListener('click', e => {
        e.stopPropagation();
        current.splice(i, 1);
        render();
      });
      wrap.insertBefore(tag, row);
    });
  }

  function add(val) {
    const v = val.trim();
    if (!v) return;
    if (!current.some(c => c.toLowerCase() === v.toLowerCase())) {
      current.push(v);
      render();
    }
    input.value = '';
    hideDD();
  }

  function hideDD() {
    dropdown.classList.add('hidden');
    focusIdx = -1;
  }

  function showDD(val) {
    if (!val) { hideDD(); return; }
    const all = opts.getOptions();
    const matches = all.filter(c =>
      c.toLowerCase().includes(val.toLowerCase()) &&
      !current.some(cur => cur.toLowerCase() === c.toLowerCase())
    );
    const exactMatch = all.some(c => c.toLowerCase() === val.toLowerCase()) ||
      current.some(c => c.toLowerCase() === val.toLowerCase());

    dropdownValues = [...matches, ...(!exactMatch ? [val] : [])];
    if (!dropdownValues.length) { hideDD(); return; }

    dropdown.innerHTML = [
      ...matches.map(m => `<div class="autocomplete-item">✦ ${m}</div>`),
      ...(!exactMatch ? [`<div class="autocomplete-item new-cat">Добавить <strong>«${val}»</strong></div>`] : [])
    ].join('');

    dropdown.querySelectorAll('.autocomplete-item').forEach((item, i) => {
      item.addEventListener('mousedown', () => add(dropdownValues[i]));
    });

    focusIdx = -1;
    dropdown.classList.remove('hidden');
  }

  function updateFocus(items, idx) {
    focusIdx = Math.max(-1, Math.min(idx, items.length - 1));
    items.forEach((el, i) => el.classList.toggle('focused', i === focusIdx));
  }

  wrap.addEventListener('click', () => input.focus());

  input.addEventListener('input', e => showDD(e.target.value.trim()));

  input.addEventListener('keydown', e => {
    const items = [...dropdown.querySelectorAll('.autocomplete-item')];
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!dropdown.classList.contains('hidden') && items.length)
        updateFocus(items, focusIdx + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!dropdown.classList.contains('hidden') && items.length)
        updateFocus(items, focusIdx - 1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!dropdown.classList.contains('hidden') && focusIdx >= 0 && dropdownValues[focusIdx]) {
        add(dropdownValues[focusIdx]);
      } else {
        const v = input.value.trim();
        if (v) add(v);
      }
    } else if (e.key === 'Escape') {
      hideDD();
    }
  });

  input.addEventListener('blur', () => setTimeout(hideDD, 150));

  return {
    get: () => [...current],
    set: vals => { current = Array.isArray(vals) ? [...vals] : []; render(); },
    reset: () => { current = []; render(); }
  };
}

// ── Modal ─────────────────────────────────────────────────────────────────────

let editingIndex = null;
let pendingImages = [];
let removedImages = [];
let imageOrder = [];

function openAdd() {
  editingIndex = null;
  pendingImages = []; removedImages = []; imageOrder = [];
  document.getElementById('modal-title').textContent = 'Новый товар';
  document.getElementById('f-name').value = '';
  document.getElementById('f-id').disabled = false;
  document.getElementById('f-id').value = '';
  document.getElementById('f-description').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-availability').value = 'on_order';
  document.getElementById('f-visible').value = 'true';
  document.getElementById('btn-delete').classList.add('hidden');
  sectionsInput.reset();
  collectionsInput.reset();
  categoriesInput.reset();
  renderImagesGrid([]);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function openEdit(i) {
  editingIndex = i;
  pendingImages = []; removedImages = [];
  const p = products[i];
  imageOrder = p.images.map(img => `existing:${img.name}`);
  document.getElementById('modal-title').textContent = 'Редактировать товар';
  document.getElementById('f-name').value = p.data.name || '';
  document.getElementById('f-id').disabled = true;
  document.getElementById('f-id').value = p.id;
  document.getElementById('f-description').value = p.data.description || '';
  document.getElementById('f-price').value = p.data.price || '';
  document.getElementById('f-availability').value = p.data.availability || (p.data.available === false ? 'unavailable' : 'available');
  document.getElementById('f-visible').value = String(p.data.visible !== false);
  document.getElementById('btn-delete').classList.remove('hidden');
  sectionsInput.set(Array.isArray(p.data.sections) ? p.data.sections : []);
  collectionsInput.set(Array.isArray(p.data.collections) ? p.data.collections : []);
  categoriesInput.set(Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : []);
  renderImagesGrid(p.images);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function getExistingImages() {
  if (editingIndex === null) return [];
  return products[editingIndex].images.filter(img => !removedImages.find(r => r.name === img.name));
}

function renderImagesGrid(existingImages) {
  const grid = document.getElementById('images-grid');
  const existing = (existingImages || []).filter(img => !removedImages.find(r => r.name === img.name));

  const allKeys = [
    ...existing.map(img => `existing:${img.name}`),
    ...pendingImages.map(p => `pending:${p.name}`)
  ];
  imageOrder = [...imageOrder.filter(k => allKeys.includes(k)), ...allKeys.filter(k => !imageOrder.includes(k))];

  const productId = products[editingIndex]?.id;

  const thumbs = imageOrder.map(key => {
    if (key.startsWith('existing:')) {
      const name = key.slice(9);
      const img = existing.find(i => i.name === name);
      if (!img) return '';
      return `<div class="img-thumb" draggable="true" data-key="${key}">
        <img src="https://raw.githubusercontent.com/${REPO}/${BRANCH}/products/${productId}/images/${name}" alt="">
        <button class="img-thumb-remove" onclick="removeExistingImage('${name}','${img.sha}')">×</button>
      </div>`;
    } else {
      const name = key.slice(8);
      const pi = pendingImages.find(p => p.name === name);
      if (!pi) return '';
      return `<div class="img-thumb" draggable="true" data-key="${key}">
        <img src="${pi.preview}" alt="">
        <button class="img-thumb-remove" onclick="removePendingImage('${name}')">×</button>
      </div>`;
    }
  }).join('');

  grid.innerHTML = thumbs + `<div class="img-add" onclick="document.getElementById('file-input').click()">+</div>`;
  initDragDrop(grid);
}

let dragSrc = null;

function initDragDrop(grid) {
  grid.querySelectorAll('.img-thumb').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragSrc = el.dataset.key;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      grid.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      grid.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      const target = el.dataset.key;
      if (!dragSrc || dragSrc === target) return;
      const from = imageOrder.indexOf(dragSrc);
      const to = imageOrder.indexOf(target);
      imageOrder.splice(from, 1);
      imageOrder.splice(to, 0, dragSrc);
      renderImagesGrid(getExistingImages());
    });
  });
}

function removeExistingImage(name, sha) {
  removedImages.push({ name, sha });
  imageOrder = imageOrder.filter(k => k !== `existing:${name}`);
  renderImagesGrid(getExistingImages());
}

function removePendingImage(name) {
  pendingImages = pendingImages.filter(p => p.name !== name);
  imageOrder = imageOrder.filter(k => k !== `pending:${name}`);
  renderImagesGrid(getExistingImages());
}

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const base64 = ev.target.result.split(',')[1];
      pendingImages.push({ base64, name: file.name, preview: ev.target.result });
      loaded++;
      if (loaded === files.length) renderImagesGrid(getExistingImages());
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

document.getElementById('btn-add').addEventListener('click', openAdd);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });

// ── Save ──────────────────────────────────────────────────────────────────────

document.getElementById('btn-save').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Сохранение...';

  try {
    const id = document.getElementById('f-id').value.trim().replace(/\s+/g, '-').toLowerCase();
    if (!id) throw new Error('Укажите ID товара');

    const data = {
      name: document.getElementById('f-name').value.trim(),
      sections: sectionsInput.get(),
      collections: collectionsInput.get(),
      categories: categoriesInput.get(),
      description: document.getElementById('f-description').value.trim(),
      price: Number(document.getElementById('f-price').value) || 0,
      availability: document.getElementById('f-availability').value,
      visible: document.getElementById('f-visible').value === 'true'
    };
    if (editingIndex === null) {
      data.createdAt = new Date().toISOString();
    }

    for (const img of removedImages) {
      await deleteFile(`products/${id}/images/${img.name}`, `remove image: ${img.name}`, img.sha);
    }

    for (const img of pendingImages) {
      await putFileBinary(`products/${id}/images/${img.name}`, img.base64, `add image: ${img.name}`);
    }

    data.imageOrder = imageOrder
      .filter(k => !removedImages.find(r => `existing:${r.name}` === k))
      .map(k => k.replace(/^(existing|pending):/, ''));

    const jsonPath = `products/${id}/product.json`;
    const existingFile = editingIndex !== null ? await getFile(jsonPath) : null;
    await putFile(jsonPath, JSON.stringify(data, null, 2), `${editingIndex !== null ? 'update' : 'add'} product: ${id}`, existingFile?.sha);

    toast('Сохранено! Сайт обновится через ~30 сек.');
    closeModal();
    await loadProducts();
  } catch(e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
});

// ── Delete ────────────────────────────────────────────────────────────────────

document.getElementById('btn-delete').addEventListener('click', async () => {
  if (editingIndex === null) return;
  const p = products[editingIndex];
  if (!confirm(`Удалить товар «${p.data.name || p.id}»?`)) return;

  const btn = document.getElementById('btn-delete');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  try {
    for (const img of p.images) {
      await deleteFile(`products/${p.id}/images/${img.name}`, `remove image: ${img.name}`, img.sha);
    }
    const keepFile = await getFile(`products/${p.id}/images/.gitkeep`);
    if (keepFile) await deleteFile(`products/${p.id}/images/.gitkeep`, `remove product: ${p.id}`, keepFile.sha);
    await deleteFile(`products/${p.id}/product.json`, `remove product: ${p.id}`, p.jsonSha);

    toast('Товар удалён');
    closeModal();
    await loadProducts();
  } catch(e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Удалить';
  }
});

// ── Transliteration ───────────────────────────────────────────────────────────

function transliterate(text) {
  const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
  return text.toLowerCase().split('').map(c => map[c] !== undefined ? map[c] : /[a-z0-9]/.test(c) ? c : '-').join('').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

document.getElementById('f-name').addEventListener('input', e => {
  const idField = document.getElementById('f-id');
  if (!idField.disabled) idField.value = transliterate(e.target.value);
});

  const el = document.getElementById('toast');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3500);
}

function removeTxSection(i) { editingTaxonomy.sections.splice(i, 1); renderTaxonomyModal(); }
function removeTxCategory(i) { editingTaxonomy.categories.splice(i, 1); renderTaxonomyModal(); }
function removeTxCollection(i) { editingTaxonomy.collections.splice(i, 1); renderTaxonomyModal(); }

// ── Collection image upload ────────────────────────────────────────────────────

let uploadingColIdx = -1;

function triggerColImg(idx) {
  uploadingColIdx = idx;
  document.getElementById('collection-image-input').click();
}

function removeColImg(idx) {
  editingTaxonomy.collections[idx].image = '';
  renderTaxonomyModal();
}

document.getElementById('collection-image-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || uploadingColIdx < 0) return;
  const idx = uploadingColIdx;
  uploadingColIdx = -1;

  const reader = new FileReader();
  reader.onload = async ev => {
    const base64 = ev.target.result.split(',')[1];
    const ext = file.name.split('.').pop().toLowerCase();
    const colName = editingTaxonomy.collections[idx].name || `collection_${idx}`;
    const safeName = colName.replace(/[^a-zA-Zа-яА-Я0-9-]/g, '_').toLowerCase();
    const filename = `collections/${safeName}.${ext}`;
    try {
      const existing = await getFile(filename);
      await putFileBinary(filename, base64, `add collection image: ${colName}`, existing?.sha);
      editingTaxonomy.collections[idx].image = filename;
      renderTaxonomyModal();
      toast('Изображение загружено');
    } catch(err) {
      toast('Ошибка загрузки: ' + err.message, true);
    }
  };
  reader.readAsDataURL(file);
});

// ── Taxonomy drag-and-drop ────────────────────────────────────────────────────

let txDragSrc = null;
let txDragType = null;

function initTaxonomyDragDrop() {
  function attachDrag(selector, type) {
    document.querySelectorAll(selector).forEach(el => {
      const idx = parseInt(el.dataset.idx);
      el.addEventListener('dragstart', e => {
        txDragSrc = idx;
        txDragType = type;
        el.classList.add('tx-dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('tx-dragging');
        document.querySelectorAll('.tx-item, .tx-collection-item').forEach(x => x.classList.remove('tx-drag-over'));
      });
      el.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.tx-item, .tx-collection-item').forEach(x => x.classList.remove('tx-drag-over'));
        el.classList.add('tx-drag-over');
      });
      el.addEventListener('drop', e => {
        e.preventDefault();
        if (txDragSrc === null || txDragSrc === idx || txDragType !== type) return;
        const arr = editingTaxonomy[type];
        const item = arr.splice(txDragSrc, 1)[0];
        arr.splice(idx, 0, item);
        renderTaxonomyModal();
      });
    });
  }

  attachDrag('#tx-sections-list .tx-item', 'sections');
  attachDrag('#tx-categories-list .tx-item', 'categories');
  attachDrag('#tx-collections-list .tx-collection-item', 'collections');
}

function addTxItem(listKey, inputId, extra = {}) {
  const input = document.getElementById(inputId);
  const v = input.value.trim();
  if (!v) return;
  if (listKey === 'collections') {
    if (!editingTaxonomy.collections.some(c => c.name.toLowerCase() === v.toLowerCase())) {
      editingTaxonomy.collections.push({ name: v, enabled: true, image: '', ...extra });
      renderTaxonomyModal();
    }
  } else {
    if (!editingTaxonomy[listKey].some(s => s.toLowerCase() === v.toLowerCase())) {
      editingTaxonomy[listKey].push(v);
      renderTaxonomyModal();
    }
  }
  input.value = '';
}

document.getElementById('tx-sections-add').addEventListener('click', () => addTxItem('sections', 'tx-sections-input'));
document.getElementById('tx-categories-add').addEventListener('click', () => addTxItem('categories', 'tx-categories-input'));
document.getElementById('tx-collections-add').addEventListener('click', () => addTxItem('collections', 'tx-collections-input'));

// Allow Enter key in taxonomy add inputs
['tx-sections-input', 'tx-categories-input', 'tx-collections-input'].forEach((id, idx) => {
  const keys = ['sections', 'categories', 'collections'];
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTxItem(keys[idx], id); }
  });
});

document.getElementById('taxonomy-save').addEventListener('click', async () => {
  const btn = document.getElementById('taxonomy-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Сохранение...';
  try {
    await putFile('data/taxonomy.json', JSON.stringify(editingTaxonomy, null, 2), 'update taxonomy', taxonomySha);
    taxonomy = editingTaxonomy;
    const f = await getFile('data/taxonomy.json');
    if (f) taxonomySha = f.sha;
    toast('Справочник сохранён');
    closeTaxonomyModal();
  } catch(e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
});

document.getElementById('taxonomy-cancel').addEventListener('click', closeTaxonomyModal);
document.getElementById('taxonomy-modal-close').addEventListener('click', closeTaxonomyModal);
document.getElementById('taxonomy-modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('taxonomy-modal-overlay')) closeTaxonomyModal();
});
document.getElementById('btn-taxonomy').addEventListener('click', openTaxonomyModal);

// ── Boot ──────────────────────────────────────────────────────────────────────

(async () => {
  const token = getToken();
  if (token && await checkToken(token).catch(() => false)) {
    showAdminScreen();
    await loadTaxonomyAdmin();
    loadProducts();
  } else {
    showTokenScreen();
  }
})();
</script>

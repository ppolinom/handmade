<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — ppolinom handmade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf7fc;
      --surface: #fff;
      --border: #e8d8f0;
      --text: #2a1f33;
      --muted: #9b86aa;
      --accent: #9b59b6;
      --accent-hover: #7d3f9a;
      --accent-soft: #f3e8f9;
      --danger: #e74c3c;
      --danger-soft: #fdf0ee;
      --success: #27ae60;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #f9eeff 0%, #fce4f5 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header a { color: var(--muted); font-size: 0.875rem; text-decoration: none; }
    header a:hover { color: var(--text); }

    .container { max-width: 960px; margin: 0 auto; padding: 2rem; }

    /* Token screen */
    #token-screen {
      max-width: 480px; margin: 4rem auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
    }
    #token-screen h2 { margin-bottom: 0.5rem; }
    #token-screen p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5; }

    /* Forms & inputs */
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    input[type=text], input[type=number], input[type=password], textarea, select {
      width: 100%; padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit; color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 100px; }
    .field { margin-bottom: 1.25rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.25rem; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: var(--accent-soft); color: var(--accent); }
    .btn-secondary:hover:not(:disabled) { background: #e8d4f5; }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-danger:hover:not(:disabled) { background: #fce0dd; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .toolbar h2 { font-size: 1.2rem; }

    /* Product list */
    .product-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .product-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .product-row img {
      width: 56px; height: 56px; border-radius: 8px;
      object-fit: cover; background: var(--bg); flex-shrink: 0;
    }
    .product-row-placeholder {
      width: 56px; height: 56px; border-radius: 8px;
      background: var(--accent-soft); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .product-row-info { flex: 1; min-width: 0; }
    .product-row-info .name { font-weight: 600; font-size: 0.95rem; }
    .product-row-info .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .product-row-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .badge { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px; }
    .badge-on { background: #e6f9ed; color: var(--success); }
    .badge-off { background: var(--accent-soft); color: var(--muted); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(42,31,51,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 2rem 1rem; overflow-y: auto; z-index: 100;
    }
    .modal {
      background: var(--surface); border-radius: 16px;
      width: 100%; max-width: 560px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      padding: 1.75rem;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .modal-header h2 { font-size: 1.15rem; }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); line-height: 1; padding: 0.1rem 0.3rem; border-radius: 4px; }
    .modal-close:hover { color: var(--text); background: var(--bg); }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }

    /* Images upload area */
    .images-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .img-thumb {
      position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-thumb-remove {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50%;
      width: 18px; height: 18px; font-size: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .img-add {
      width: 72px; height: 72px; border-radius: 8px;
      border: 1.5px dashed var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--muted); cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .img-add:hover { border-color: var(--accent); color: var(--accent); }

    /* Toast */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--text); color: #fff;
      padding: 0.65rem 1.25rem; border-radius: 10px;
      font-size: 0.875rem; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.error { background: var(--danger); }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* Tag input */
    .tag-input-wrap {
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 0.35rem 0.5rem; min-height: 42px;
      display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
      background: var(--surface); cursor: text;
      transition: border-color 0.15s;
    }
    .tag-input-wrap:focus-within { border-color: var(--accent); }
    .tag {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 999px; padding: 0.2rem 0.5rem 0.2rem 0.7rem;
      font-size: 0.8rem; font-weight: 500; white-space: nowrap;
    }
    .tag button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; line-height: 1; font-size: 1rem; opacity: 0.6; }
    .tag button:hover { opacity: 1; }
    .tag-input-row { position: relative; flex: 1; min-width: 140px; }
    .tag-input-row input {
      border: none; outline: none; padding: 0.25rem 0.4rem;
      font-size: 0.9rem; width: 100%; background: transparent; font-family: inherit; color: var(--text);
    }
    .autocomplete-dropdown {
      position: absolute; top: calc(100% + 4px); left: -6px; right: -6px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 50; overflow: hidden;
    }
    .autocomplete-item {
      padding: 0.5rem 0.85rem; font-size: 0.875rem; cursor: pointer;
    }
    .autocomplete-item:hover, .autocomplete-item.focused { background: var(--accent-soft); }
    .autocomplete-item.new-cat { color: var(--muted); }
    .autocomplete-item.new-cat strong { color: var(--text); font-style: normal; }

    /* Admin filters */
    .admin-filters { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
    .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.4rem 1rem; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 0.875rem;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Hidden product dimming */
    .product-row.is-hidden { opacity: 0.45; }
    .product-row.is-hidden:hover { opacity: 0.7; }
    .badge-hidden { background: #f0ebe5; color: var(--muted); }

    /* Image drag-and-drop ordering */
    .img-thumb { cursor: grab; }
    .img-thumb.dragging { opacity: 0.4; cursor: grabbing; }
    .img-thumb.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>

<header>
  <h1>Админка</h1>
  <div style="display:flex;gap:1rem;align-items:center">
    <a href="./" target="_blank">← Сайт</a>
    <button class="btn btn-sm btn-secondary" id="btn-logout">Выйти</button>
  </div>
</header>

<!-- Token screen -->
<div id="token-screen" class="hidden">
  <h2>Введите GitHub токен</h2>
  <p>Токен сохранится в браузере и не будет никуда передан.<br>
     Нужны права: <strong>repo</strong> + <strong>workflow</strong>.</p>
  <div class="field">
    <label>Personal Access Token</label>
    <input type="password" id="token-input" placeholder="ghp_...">
  </div>
  <button class="btn btn-primary" id="btn-token-save">Войти</button>
</div>

<!-- Main admin -->
<div id="admin-screen" class="hidden">
  <div class="container">
    <div class="toolbar">
      <h2>Товары</h2>
      <button class="btn btn-primary" id="btn-add">+ Добавить товар</button>
    </div>
    <div class="admin-filters">
      <div class="filter-row" id="filter-visible-row">
        <button class="filter-btn active" data-vis="">Все</button>
        <button class="filter-btn" data-vis="true">Отображаемые</button>
        <button class="filter-btn" data-vis="false">Скрытые</button>
      </div>
      <div class="filter-row" id="filter-category-row">
        <button class="filter-btn active" data-cat="">Все категории</button>
      </div>
    </div>
    <div class="product-list" id="product-list">
      <p style="color:var(--muted)">Загрузка...</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Товар</h2>
      <button class="modal-close" id="modal-close">×</button>
    </div>

    <div class="field">
      <label>Название</label>
      <input type="text" id="f-name" placeholder="Браслет «Весна»">
    </div>
    <div class="field">
      <label>ID папки (латиница, заполняется автоматически)</label>
      <input type="text" id="f-id" placeholder="braslet-vesna">
    </div>
    <div class="field">
      <label>Категории</label>
      <div class="tag-input-wrap" id="categories-wrap" onclick="document.getElementById('f-category-input').focus()">
        <div class="tag-input-row" id="cat-input-row">
          <input type="text" id="f-category-input" placeholder="Добавить категорию...">
          <div class="autocomplete-dropdown hidden" id="cat-dropdown"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Описание</label>
      <textarea id="f-description" placeholder="Опишите изделие..."></textarea>
    </div>
    <div class="field">
      <label>Цена (₽)</label>
      <input type="number" id="f-price" placeholder="500" min="0">
    </div>
    <div class="field">
      <label>Наличие</label>
      <select id="f-availability">
        <option value="on_order">На заказ</option>
        <option value="available">В наличии</option>
        <option value="unavailable">Нет в наличии</option>
      </select>
    </div>
    <div class="field">
      <label>Видимость на сайте</label>
      <select id="f-visible">
        <option value="true">Отображать</option>
        <option value="false">Скрыть с сайта</option>
      </select>
    </div>
    <div class="field">
      <label>Фотографии</label>
      <div class="images-grid" id="images-grid"></div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none">
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-delete" style="margin-right:auto">Удалить</button>
      <button class="btn btn-secondary" id="btn-cancel">Отмена</button>
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const REPO = 'ppolinom/handmade';
const BRANCH = 'main';

// ── GitHub API ────────────────────────────────────────────────────────────────

function getToken() { return localStorage.getItem('gh_token'); }

async function ghFetch(path, options = {}) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

async function getFile(path) {
  try { return await ghFetch(`contents/${path}?ref=${BRANCH}`); }
  catch { return null; }
}

async function putFile(path, content, message, sha = undefined) {
  const body = { message, content: btoa(unescape(encodeURIComponent(content))), branch: BRANCH };
  if (sha) body.sha = sha;
  return ghFetch(`contents/${path}`, { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
}

async function putFileBinary(path, base64content, message, sha = undefined) {
  const body = { message, content: base64content, branch: BRANCH };
  if (sha) body.sha = sha;
  return ghFetch(`contents/${path}`, { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
}

async function deleteFile(path, message, sha) {
  return ghFetch(`contents/${path}`, { method: 'DELETE', body: JSON.stringify({ message, sha, branch: BRANCH }), headers: { 'Content-Type': 'application/json' } });
}

async function listDir(path) {
  try { return await ghFetch(`contents/${path}?ref=${BRANCH}`); }
  catch { return []; }
}

// ── Auth ──────────────────────────────────────────────────────────────────────

async function checkToken(token) {
  const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `Bearer ${token}` } });
  return res.ok;
}

function showTokenScreen() {
  document.getElementById('token-screen').classList.remove('hidden');
  document.getElementById('admin-screen').classList.add('hidden');
}

function showAdminScreen() {
  document.getElementById('token-screen').classList.add('hidden');
  document.getElementById('admin-screen').classList.remove('hidden');
}

document.getElementById('btn-token-save').addEventListener('click', async () => {
  const token = document.getElementById('token-input').value.trim();
  if (!token) return;
  const btn = document.getElementById('btn-token-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const ok = await checkToken(token).catch(() => false);
  btn.disabled = false; btn.textContent = 'Войти';
  if (!ok) { toast('Токен не подошёл', true); return; }
  localStorage.setItem('gh_token', token);
  showAdminScreen();
  loadProducts();
});

document.getElementById('btn-logout').addEventListener('click', () => {
  localStorage.removeItem('gh_token');
  showTokenScreen();
});

// ── Products list ─────────────────────────────────────────────────────────────

let products = []; // { id, data, images: [{name, sha}] }

async function loadProducts() {
  const listEl = document.getElementById('product-list');
  listEl.innerHTML = '<p style="color:var(--muted)">Загрузка...</p>';

  try {
    const dirs = (await listDir('products')).filter(f => f.type === 'dir');
    products = [];
    for (const dir of dirs) {
      const jsonFile = await getFile(`products/${dir.name}/product.json`);
      if (!jsonFile) continue;
      const data = JSON.parse(decodeURIComponent(escape(atob(jsonFile.content.replace(/\n/g, '')))));
      const imgFiles = (await listDir(`products/${dir.name}/images`)).filter(f => /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name));
      products.push({ id: dir.name, jsonSha: jsonFile.sha, data, images: imgFiles });
    }
    renderProductList();
  } catch(e) {
    listEl.innerHTML = `<p style="color:var(--muted)">Ошибка загрузки: ${e.message}</p>`;
  }
}

function renderProductList() {
  const listEl = document.getElementById('product-list');

  // Rebuild category filter buttons
  const catRow = document.getElementById('filter-category-row');
  const allCats = [...new Map(products.flatMap(p =>
    (Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : [])
    .map(c => [c.toLowerCase(), c])
  ).values())];
  catRow.innerHTML = `<button class="filter-btn${activeCatFilter === '' ? ' active' : ''}" data-cat="">Все категории</button>` +
    allCats.map(c => `<button class="filter-btn${activeCatFilter === c ? ' active' : ''}" data-cat="${c}">${c}</button>`).join('');

  const filtered = products.filter(p => {
    if (activeVisFilter === 'true' && p.data.visible === false) return false;
    if (activeVisFilter === 'false' && p.data.visible !== false) return false;
    if (activeCatFilter) {
      const cats = Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : [];
      if (!cats.some(c => c.toLowerCase() === activeCatFilter.toLowerCase())) return false;
    }
    return true;
  });

  if (!products.length) {
    listEl.innerHTML = '<p style="color:var(--muted)">Товаров пока нет. Добавьте первый!</p>';
    return;
  }
  if (!filtered.length) {
    listEl.innerHTML = '<p style="color:var(--muted)">Нет товаров по выбранным фильтрам.</p>';
    return;
  }

  listEl.innerHTML = filtered.map(p => {
    const i = products.indexOf(p);
    const isHidden = p.data.visible === false;
    const thumb = p.images[0]
      ? `<img src="https://raw.githubusercontent.com/${REPO}/${BRANCH}/products/${p.id}/images/${p.images[0].name}" alt="">`
      : `<div class="product-row-placeholder">🧶</div>`;
    const avail = p.data.availability || (p.data.available === false ? 'unavailable' : 'available');
    const availBadge = avail === 'available'
      ? '<span class="badge badge-on">В наличии</span>'
      : avail === 'on_order' ? '<span class="badge badge-off">На заказ</span>'
      : '<span class="badge badge-off">Нет</span>';
    const hiddenBadge = isHidden ? '<span class="badge badge-hidden">Скрыт</span>' : '';
    const cats = (Array.isArray(p.data.categories) ? p.data.categories : p.data.category ? [p.data.category] : []).join(', ') || '—';
    return `
      <div class="product-row${isHidden ? ' is-hidden' : ''}">
        ${thumb}
        <div class="product-row-info">
          <div class="name">${p.data.name || p.id} ${hiddenBadge}</div>
          <div class="meta">${cats} · ${p.data.price || 0} ₽ · ${availBadge}</div>
        </div>
        <div class="product-row-actions">
          <button class="btn btn-sm btn-secondary" onclick="openEdit(${i})">Изменить</button>
        </div>
      </div>`;
  }).join('');
}

// ── Modal ─────────────────────────────────────────────────────────────────────

let editingIndex = null;
let pendingImages = []; // { base64, name, preview } — новые
let removedImages = []; // { name, sha } — на удаление
let currentCategories = []; // текущий набор категорий товара
let imageOrder = []; // ['existing:filename', 'pending:filename'] — итоговый порядок

function openAdd() {
  editingIndex = null;
  pendingImages = []; removedImages = []; imageOrder = [];
  currentCategories = [];
  document.getElementById('modal-title').textContent = 'Новый товар';
  document.getElementById('f-name').value = '';
  document.getElementById('f-id').disabled = false;
  document.getElementById('f-id').value = '';
  document.getElementById('f-description').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-availability').value = 'on_order';
  document.getElementById('f-visible').value = 'true';
  document.getElementById('btn-delete').classList.add('hidden');
  renderCategoryTags();
  renderImagesGrid([]);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function openEdit(i) {
  editingIndex = i;
  pendingImages = []; removedImages = [];
  const p = products[i];
  const cats = Array.isArray(p.data.categories) ? p.data.categories : (p.data.category ? [p.data.category] : []);
  currentCategories = [...cats];
  imageOrder = p.images.map(img => `existing:${img.name}`);
  document.getElementById('modal-title').textContent = 'Редактировать товар';
  document.getElementById('f-name').value = p.data.name || '';
  document.getElementById('f-id').disabled = true;
  document.getElementById('f-id').value = p.id;
  document.getElementById('f-description').value = p.data.description || '';
  document.getElementById('f-price').value = p.data.price || '';
  document.getElementById('f-availability').value = p.data.availability || (p.data.available === false ? 'unavailable' : 'available');
  document.getElementById('f-visible').value = String(p.data.visible !== false);
  document.getElementById('btn-delete').classList.remove('hidden');
  renderCategoryTags();
  renderImagesGrid(p.images);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function getExistingImages() {
  if (editingIndex === null) return [];
  return products[editingIndex].images.filter(img => !removedImages.find(r => r.name === img.name));
}

function renderImagesGrid(existingImages) {
  const grid = document.getElementById('images-grid');
  const existing = (existingImages || []).filter(img => !removedImages.find(r => r.name === img.name));

  // Build order from imageOrder, appending any new items not yet there
  const allKeys = [
    ...existing.map(img => `existing:${img.name}`),
    ...pendingImages.map(p => `pending:${p.name}`)
  ];
  // Remove stale keys from imageOrder, add new ones
  imageOrder = [...imageOrder.filter(k => allKeys.includes(k)), ...allKeys.filter(k => !imageOrder.includes(k))];

  const productId = products[editingIndex]?.id;

  const thumbs = imageOrder.map(key => {
    if (key.startsWith('existing:')) {
      const name = key.slice(9);
      const img = existing.find(i => i.name === name);
      if (!img) return '';
      return `<div class="img-thumb" draggable="true" data-key="${key}">
        <img src="https://raw.githubusercontent.com/${REPO}/${BRANCH}/products/${productId}/images/${name}" alt="">
        <button class="img-thumb-remove" onclick="removeExistingImage('${name}','${img.sha}')">×</button>
      </div>`;
    } else {
      const name = key.slice(8);
      const pi = pendingImages.find(p => p.name === name);
      if (!pi) return '';
      return `<div class="img-thumb" draggable="true" data-key="${key}">
        <img src="${pi.preview}" alt="">
        <button class="img-thumb-remove" onclick="removePendingImage('${name}')">×</button>
      </div>`;
    }
  }).join('');

  grid.innerHTML = thumbs + `<div class="img-add" onclick="document.getElementById('file-input').click()">+</div>`;
  initDragDrop(grid);
}

let dragSrc = null;

function initDragDrop(grid) {
  grid.querySelectorAll('.img-thumb').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragSrc = el.dataset.key;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      grid.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      grid.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      const target = el.dataset.key;
      if (!dragSrc || dragSrc === target) return;
      const from = imageOrder.indexOf(dragSrc);
      const to = imageOrder.indexOf(target);
      imageOrder.splice(from, 1);
      imageOrder.splice(to, 0, dragSrc);
      renderImagesGrid(getExistingImages());
    });
  });
}

function removeExistingImage(name, sha) {
  removedImages.push({ name, sha });
  imageOrder = imageOrder.filter(k => k !== `existing:${name}`);
  renderImagesGrid(getExistingImages());
}

function removePendingImage(name) {
  pendingImages = pendingImages.filter(p => p.name !== name);
  imageOrder = imageOrder.filter(k => k !== `pending:${name}`);
  renderImagesGrid(getExistingImages());
}

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const base64 = ev.target.result.split(',')[1];
      pendingImages.push({ base64, name: file.name, preview: ev.target.result });
      loaded++;
      if (loaded === files.length) renderImagesGrid(getExistingImages());
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

document.getElementById('btn-add').addEventListener('click', openAdd);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });

// ── Save ──────────────────────────────────────────────────────────────────────

document.getElementById('btn-save').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Сохранение...';

  try {
    const id = document.getElementById('f-id').value.trim().replace(/\s+/g, '-').toLowerCase();
    if (!id) throw new Error('Укажите ID товара');

    const data = {
      name: document.getElementById('f-name').value.trim(),
      categories: currentCategories,
      description: document.getElementById('f-description').value.trim(),
      price: Number(document.getElementById('f-price').value) || 0,
      availability: document.getElementById('f-availability').value,
      visible: document.getElementById('f-visible').value === 'true'
    };

    // Delete removed images
    for (const img of removedImages) {
      await deleteFile(`products/${id}/images/${img.name}`, `remove image: ${img.name}`, img.sha);
    }

    // Upload new images
    for (const img of pendingImages) {
      await putFileBinary(`products/${id}/images/${img.name}`, img.base64, `add image: ${img.name}`);
    }

    // Save image order into product.json
    data.imageOrder = imageOrder.filter(k => !removedImages.find(r => `existing:${r.name}` === k)).map(k => k.replace(/^(existing|pending):/, ''));

    // Save product.json
    const jsonPath = `products/${id}/product.json`;
    const existingFile = editingIndex !== null ? await getFile(jsonPath) : null;
    await putFile(jsonPath, JSON.stringify(data, null, 2), `${editingIndex !== null ? 'update' : 'add'} product: ${id}`, existingFile?.sha);

    toast('Сохранено! Сайт обновится через ~30 сек.');
    closeModal();
    await loadProducts();
  } catch(e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
});

// ── Delete ────────────────────────────────────────────────────────────────────

document.getElementById('btn-delete').addEventListener('click', async () => {
  if (editingIndex === null) return;
  const p = products[editingIndex];
  if (!confirm(`Удалить товар «${p.data.name || p.id}»?`)) return;

  const btn = document.getElementById('btn-delete');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  try {
    // Delete all images
    for (const img of p.images) {
      await deleteFile(`products/${p.id}/images/${img.name}`, `remove image: ${img.name}`, img.sha);
    }
    // Delete .gitkeep if exists
    const keepFile = await getFile(`products/${p.id}/images/.gitkeep`);
    if (keepFile) await deleteFile(`products/${p.id}/images/.gitkeep`, `remove product: ${p.id}`, keepFile.sha);
    // Delete product.json
    await deleteFile(`products/${p.id}/product.json`, `remove product: ${p.id}`, p.jsonSha);

    toast('Товар удалён');
    closeModal();
    await loadProducts();
  } catch(e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Удалить';
  }
});

// ── Transliteration & ID autofill ────────────────────────────────────────────

function transliterate(text) {
  const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
  return text.toLowerCase().split('').map(c => map[c] !== undefined ? map[c] : /[a-z0-9]/.test(c) ? c : '-').join('').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

document.getElementById('f-name').addEventListener('input', e => {
  const idField = document.getElementById('f-id');
  if (!idField.disabled) idField.value = transliterate(e.target.value);
});

// ── Category tag input ────────────────────────────────────────────────────────

function getAllExistingCategories() {
  const map = new Map();
  for (const p of products) {
    const cats = Array.isArray(p.data.categories) ? p.data.categories : (p.data.category ? [p.data.category] : []);
    for (const c of cats) { const k = c.toLowerCase(); if (!map.has(k)) map.set(k, c); }
  }
  return [...map.values()];
}

function renderCategoryTags() {
  const wrap = document.getElementById('categories-wrap');
  const row = document.getElementById('cat-input-row');
  wrap.querySelectorAll('.tag').forEach(t => t.remove());
  currentCategories.forEach((cat, i) => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.innerHTML = `${cat} <button type="button" onclick="removeCategory(${i})">×</button>`;
    wrap.insertBefore(tag, row);
  });
}

function removeCategory(i) {
  currentCategories.splice(i, 1);
  renderCategoryTags();
}

function addCategory(cat) {
  const trimmed = cat.trim();
  if (!trimmed) return;
  if (!currentCategories.some(c => c.toLowerCase() === trimmed.toLowerCase())) {
    currentCategories.push(trimmed);
    renderCategoryTags();
  }
  document.getElementById('f-category-input').value = '';
  hideCatDropdown();
}

function hideCatDropdown() { document.getElementById('cat-dropdown').classList.add('hidden'); }

function showCatDropdown(val) {
  const dd = document.getElementById('cat-dropdown');
  if (!val) { hideCatDropdown(); return; }
  const all = getAllExistingCategories();
  const matches = all.filter(c =>
    c.toLowerCase().includes(val.toLowerCase()) &&
    !currentCategories.some(cur => cur.toLowerCase() === c.toLowerCase())
  );
  const exactMatch = all.some(c => c.toLowerCase() === val.toLowerCase());
  const items = [
    ...matches.map(label => `<div class="autocomplete-item" onmousedown="addCategory('${label.replace(/'/g,"\\'")}')">✦ ${label}</div>`),
    ...(!exactMatch ? [`<div class="autocomplete-item new-cat" onmousedown="addCategory('${val.replace(/'/g,"\\'")}')">Новая категория <strong>«${val}»</strong> — нажмите Enter</div>`] : [])
  ];
  if (!items.length) { hideCatDropdown(); return; }
  dd.innerHTML = items.join('');
  dd.classList.remove('hidden');
}

document.getElementById('f-category-input').addEventListener('input', e => showCatDropdown(e.target.value.trim()));
document.getElementById('f-category-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (v) addCategory(v); }
  else if (e.key === 'Escape') hideCatDropdown();
});
document.getElementById('f-category-input').addEventListener('blur', () => setTimeout(hideCatDropdown, 150));

// ── Toast ─────────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, error = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (error ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3500);
}

// ── Filters ───────────────────────────────────────────────────────────────────

let activeVisFilter = '';
let activeCatFilter = '';

document.getElementById('filter-visible-row').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeVisFilter = btn.dataset.vis;
  document.getElementById('filter-visible-row').querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.vis === activeVisFilter));
  renderProductList();
});

document.getElementById('filter-category-row').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeCatFilter = btn.dataset.cat;
  document.getElementById('filter-category-row').querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === activeCatFilter));
  renderProductList();
});

// ── Boot ──────────────────────────────────────────────────────────────────────

(async () => {
  const token = getToken();
  if (token && await checkToken(token).catch(() => false)) {
    showAdminScreen();
    loadProducts();
  } else {
    showTokenScreen();
  }
})();
</script>

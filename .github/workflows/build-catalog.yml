name: Build Catalog

on:
  push:
    branches: [main]
    paths:
      - 'products/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build catalog
        run: node scripts/build-catalog.js

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --staged --quiet || git commit -m "chore: update catalog.json"
          git push
